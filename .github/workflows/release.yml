name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.4.3"
        required: true
        type: string
      dry_run:
        description: "Run all gates and npm publish --dry-run without publishing, tagging, or pushing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release @cchistory/lite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # VERSION routes the dispatch input through the shell environment instead of
    # inline expression expansion, so a crafted version string can never be
    # interpreted as shell syntax.
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Print release plan
        run: |
          echo "Release version: $VERSION"
          echo "Dry run: ${{ inputs.dry_run }}"

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prepare release (bump versions, fold changelog)
        run: node scripts/release-prepare.mjs "$VERSION"

      - name: Build Lite pipeline
        run: pnpm run build:lite

      - name: Test Lite pipeline
        run: pnpm test

      - name: Verify governance
        run: pnpm run verify:governance

      - name: Verify standalone Lite artifact
        run: pnpm run verify:lite-artifact -- --skip-build

      - name: Build release artifact and tarball
        run: pnpm run lite:artifact -- --skip-build

      - name: Publish to npm (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish "./dist/lite-artifacts/cchistory-lite-$VERSION" --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish "./dist/lite-artifacts/cchistory-lite-$VERSION" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Finalize release (commit, tag, push, GitHub Release)
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json \
            apps/lite-cli/package.json \
            apps/lite-cli/src/version.ts \
            apps/lite-tui/package.json \
            apps/lite-tui/src/version.ts \
            packages/domain/package.json \
            packages/canonical/package.json \
            packages/source-adapters/package.json \
            packages/live-runtime/package.json \
            CHANGELOG.md
          git commit -m "chore: release $VERSION"
          git tag "v$VERSION"
          # HEAD:main works whether checkout left a local branch or a detached
          # HEAD; a failed push here would strand the already-published version.
          git push origin HEAD:main && git push origin "v$VERSION"
          gh release create "v$VERSION" \
            "dist/lite-artifacts/cchistory-lite-$VERSION.tgz" \
            --title "v$VERSION" \
            --generate-notes
